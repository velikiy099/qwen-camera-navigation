name: Camera-agent checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pillow==10.4.0 pyyaml==6.0.2
      - name: Agent, watchdog, ROS mock and HTTP contract tests
        env:
          PYTHONPATH: src/pai_robot
        run: python -m unittest discover -s src/pai_robot/test -v
      - name: Syntax, RGB and robot-side odometry configuration
        run: python tools/static_check.py
      # These checks do not measure Gazebo navigation performance.
